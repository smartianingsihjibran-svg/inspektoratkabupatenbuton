# ============================================================
#  netlify.toml — Inspektorat Kabupaten Buton
# ============================================================

[build]
  # Tidak ada proses build khusus; situs berupa file statis.
  publish = "."
  functions = "netlify/functions"

# Arahkan semua permintaan /api/* ke fungsi serverless "api"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Pastikan halaman utama selalu index.html
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[functions]
  # Gunakan runtime Node modern (mendukung fetch bawaan)
  node_bundler = "esbuild"
